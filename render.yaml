# Publish https://chiransh-foods.onrender.com from the main branch.
# A push or merge to main builds and deploys this service. Do not paste code
# into the Render dashboard.
services:
  - type: web
    name: chiransh-foods
    runtime: node
    repo: https://github.com/cdasadiya/chiransh_foods
    branch: main
    autoDeployTrigger: commit
    buildCommand: yarn
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
